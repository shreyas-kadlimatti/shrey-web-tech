<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Event Aura</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-[#03001e] to-[#7303c0] text-white min-h-screen">

  <!-- Navbar -->
  <nav class="bg-[#1a1a2e] shadow-md p-4">
    <div class="container mx-auto flex justify-between items-center">
      <a href="index.html" class="text-2xl font-extrabold text-white animate-pulse">Event Aura</a>
      <ul class="flex space-x-6 text-white">
        <li><a href="index.html" class="hover:text-blue-400 transition">Home</a></li>
        <li><a href="about.html" class="hover:text-blue-400 transition">About</a></li>
        <li><a href="contact.html" class="text-blue-400 font-semibold">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- Contact Section -->
  <section class="py-12 bg-[#1a1a2e]">
    <div class="container mx-auto text-center text-white">
      <h2 class="text-4xl font-semibold mb-6">Get in Touch</h2>
      <p class="text-lg mb-8">We would love to hear from you! Fill out the form below to reach out to us.</p>

      <form class="max-w-2xl mx-auto space-y-6">
        <!-- Name Input -->
        <div>
          <input
            type="text"
            name="name"
            placeholder="Your Name"
            class="w-full p-3 text-lg bg-[#2a2a2e] rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300"
          />
        </div>

        <!-- Email Input -->
        <div>
          <input
            type="email"
            name="email"
            placeholder="Your Email"
            class="w-full p-3 text-lg bg-[#2a2a2e] rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300"
          />
        </div>

        <!-- Message Textarea -->
        <div>
          <textarea
            name="message"
            rows="5"
            placeholder="Your Message"
            class="w-full p-3 text-lg bg-[#2a2a2e] rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <div>
          <button
            type="submit"
            class="w-full py-3 bg-blue-600 rounded-lg text-white font-semibold text-lg hover:bg-blue-700 transition-all duration-300 ease-in-out"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </section>
</body>
</html>
